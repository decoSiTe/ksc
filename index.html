    if (visibleKeys.length === 1 && visibleKeys[0] === "shortBreakEnd") return "Short Break Start recorded. Only Short Break End is available.";
    if (visibleKeys.length === 1 && visibleKeys[0] === "shortBreakStart") return "Main break completed. Only Short Break Start is available.";
    if (visibleKeys.length === 1 && visibleKeys[0] === "breakStart") return shortAllowed ? "Short break completed. Only Break Start is available." : "Select Break Start.";
    return shortAllowed ? "Select Break Start or Short Break Start." : "Select Break Start.";
  }

  function showEmp(emp) {
    currentEmp = emp;
    document.getElementById("eName").textContent = emp.name;
    document.getElementById("eMeta").textContent =
      emp.code + " · " + (emp.department||"") + " · " + (emp.position||"");

    const codeKey = String(emp.code).toUpperCase();
    const activeState = getActiveRecordState(emp);
    const rec = enforceNightShiftLastActionState(
      cleanStaleNightShiftEnds(activeState.record || {}, emp), emp
    );
    saveActiveRecordState(emp, rec, activeState);

    if (!recordsReady) {
      setVisibleActions([]);
      const note = document.querySelector(".note");
      if (note) note.textContent = "Syncing latest DTR records. Please wait.";
      show("actCard", true);
      toast("Syncing latest DTR records. Please wait.", "warn");
      return;
    }

    const departedTime = String(rec.departure || "").trim();
    const alreadyDeparted = isDepartureRecorded(rec);
    const visibleKeys = alreadyDeparted ? [] : getNextVisibleActions(rec, emp);
    setVisibleActions(visibleKeys);

    document.querySelectorAll(".abtn").forEach(function(btn) {
      const actionKey = btn.dataset.a;
      const allowRepeatBreakStart = (actionKey === "breakStart") && isMultiBreakDepartment(emp);
      btn.dataset.doneTime = (allowRepeatBreakStart ? "" : (rec[actionKey] || ""));
      btn.classList.remove("locked");

      if (alreadyDeparted) {
        btn.disabled = true;
        btn.classList.add("locked");
        btn.dataset.doneTime = departedTime || "Departure";
        btn.title = "Departure already recorded" + (departedTime ? " at " + departedTime : "") + ". Attendance is completed for today.";
        return;
      }

      if (!visibleKeys.includes(actionKey)) {
        btn.disabled = true;
        return;
      }

      btn.disabled = false;
      btn.title = "";
    });

    const note = document.querySelector(".note");
    if (note) note.textContent = alreadyDeparted
      ? "Attendance completed for today."
      : actionInstruction(rec, visibleKeys, emp);

    show("actCard",true);

    updateReminderStack();

    if (alreadyDeparted) {
      toast("⚠️ " + emp.name + " already departed" + (departedTime ? " at " + departedTime : "") + ". Attendance completed for today.", "warn");
    } else if (!visibleKeys.length) {
      toast(actionInstruction(rec, visibleKeys, emp), isNightShiftEmployee(emp) ? "warn" : "ok");
    } else {
      hideToast();
    }
  }
  function hideEmp() { currentEmp=null; show("actCard",false); updateReminderStack(); }

  // ── Action buttons ────────────────────────────────────────────────────────
  const labels = {
    arrival:"Arrived",
    breakStart:"Break Start",
    shortBreakStart:"Short Break Start",
    breakEnd:"Break End",
    shortBreakEnd:"Short Break End",
    departure:"Departure"
  };
  const warnMsgs = {
    arrival:         "⚠️ Arrived already recorded",
    breakStart:      "⚠️ Break Start already recorded",
    shortBreakStart: "⚠️ Short Break Start already recorded",
    breakEnd:        "⚠️ Break End already recorded",
    shortBreakEnd:   "⚠️ Short Break End already recorded",
    departure:       "⚠️ Departure already recorded"
  };

  document.querySelectorAll(".abtn").forEach(function(b) {
    b.addEventListener("click", function() {
      if (isSending || b.disabled) return;

      const codeKey = currentEmp ? String(currentEmp.code).toUpperCase() : "";
      const activeState = getActiveRecordState(currentEmp);
      const rec = cleanStaleNightShiftEnds(activeState.record || {}, currentEmp);
      saveActiveRecordState(currentEmp, rec, activeState);
      if (isDepartureRecorded(rec)) {
        lockDepartedEmployee(currentEmp, rec.departure || "");
        return;
      }

      const allowRepeatBreakStart = (b.dataset.a === "breakStart") && isMultiBreakDepartment(currentEmp);
      if (b.dataset.doneTime && !allowRepeatBreakStart) {
        toast(warnMsgs[b.dataset.a] + " at " + b.dataset.doneTime, "warn");
        return;
      }
      doAction(b.dataset.a);
    });
  });

  function lockDepartedEmployee(emp, departedTime) {
    setVisibleActions([]);
    document.querySelectorAll(".abtn").forEach(function(btn) {
      btn.disabled = true;
      btn.classList.add("locked");
      btn.dataset.doneTime = departedTime || "Departure";
      btn.title = "Departure already recorded" + (departedTime ? " at " + departedTime : "") + ". Attendance is completed for today.";
    });
    if (emp) {
      toast("⚠️ " + emp.name + " already departed" + (departedTime ? " at " + departedTime : "") + ". Attendance completed for today.", "warn");
    }
  }

  async function doAction(key) {
    if (!currentEmp || isSending) return;
    isSending = true;
    const emp = currentEmp;
    const now = new Date(), calendarDate=fmt(now), time=fmtT(now), ts=now.toISOString();

    const codeKey = String(emp.code).toUpperCase();
    const activeState = getActiveRecordState(emp);
    const workDate = activeState.date || calendarDate;
    const activeRec = enforceNightShiftLastActionState(
      cleanStaleNightShiftEnds(activeState.record || {}, emp), emp
    );
    saveActiveRecordState(emp, activeRec, activeState);

    if (isDayOffScheduled(emp, activeRec)) {
      toast("⚠️ Day off. Break buttons are not available.", "warn");
      isSending = false;
      return;
    }

    if (isMorningShiftDutyFinished(emp, activeRec)) {
      toast("⚠️ Duty schedule is finished. Break buttons are not available.", "warn");
      isSending = false;
      return;
    }

    if (key === "breakStart" && isMultiBreakDepartment(emp) &&
        hasValue(activeRec.breakStart) && hasValue(activeRec.breakEnd)) {
      // Starting a new cycle for Checkers/Packaging — clear the completed
      // pair locally too so the kiosk doesn't flash "already recorded".
      activeRec.breakStart = "";
      activeRec.breakEnd = "";
    }

    activeRec[key] = time;
    activeRec.lastAction = labels[key];
    activeRec.timestamp = ts;
    saveActiveRecordState(emp, activeRec, activeState);

    // Protect this new state from an older background response until Apps
    // Script confirms that Google Sheet has committed the action.
    pendingWritesByCode[codeKey] = {
      source: activeState.source,
      date: workDate,
      record: Object.assign({}, activeRec)
    };
    const btn = document.querySelector(".abtn[data-a='" + key + "']");
    if (btn) btn.dataset.doneTime = time;

    const updatedVisibleKeys = getNextVisibleActions(activeRec, emp);
    setVisibleActions(updatedVisibleKeys);
    const note = document.querySelector(".note");
    if (note) note.textContent = actionInstruction(activeRec, updatedVisibleKeys, emp);
    updateReminderStack();

    const payload = {
      type:"attendance", date:workDate, timestamp:ts,
      employeeCode:emp.code, employeeName:emp.name,
      department:emp.department||"", position:emp.position||"",
      lastAction:labels[key], source:"qr-kiosk"
    };
    if (key==="arrival")         payload.arrival         = time;
    if (key==="breakStart")      payload.breakStart      = time;
    if (key==="shortBreakStart") payload.shortBreakStart = time;
    if (key==="breakEnd")        payload.breakEnd        = time;
    if (key==="shortBreakEnd")   payload.shortBreakEnd   = time;
    if (key==="departure")       payload.departure       = time;

    toast("✅ " + emp.name + " — " + labels[key] + " at " + time, "ok");

    // Clear the kiosk immediately, but wait for the real Apps Script response
    // in the background. The local action state stays authoritative meanwhile.
    sendToSheet(payload)
      .then(function(result) {
        if (!result || result.ok === false) {
          throw new Error((result && result.error) || "Google Sheet did not confirm the action.");
        }
        delete pendingWritesByCode[codeKey];
        announceDtrChange(emp, key, time);
        return refreshEmployeeState(emp);
      })
      .catch(async function(err) {
        console.warn("Attendance response was not confirmed; checking Google Sheet:", err);

        const wasSaved = await verifyAttendanceSaved(emp, key, time, workDate);
        delete pendingWritesByCode[codeKey];

        if (wasSaved) {
          announceDtrChange(emp, key, time);
          return;
        }

        console.error("Attendance write failed after verification:", err);
        toast("⚠ Action was not saved. Please try again.", "err");
        setTimeout(hideToast, 3500);
      });

    if (key === "departure") {
      lockDepartedEmployee(emp, time);
    }

    setTimeout(function() {
      isSending = false;
      document.getElementById("empIn").value = "";
      hideEmp();
      hideToast();
      document.getElementById("empIn").focus();
    }, QUICK_RESET_MS);
  }

  async function sendToSheet(payload) {
    // JSONP returns only after Code.gs finishes the write and flushes the Sheet.
    // Unlike no-cors POST, this gives the kiosk a real success/failure response.
    return jsonpRequest({
      data: JSON.stringify(payload)
    }, 5000);
  }

  // ── QR Scanner ────────────────────────────────────────────────────────────
  document.getElementById("scanBtn").addEventListener("click", startScan);
  document.getElementById("closeBtn").addEventListener("click", stopScan);

  let qrLibPromise = null;

  function ensureQrLibrary() {
    if (window.Html5Qrcode) return Promise.resolve();
    if (qrLibPromise) return qrLibPromise;

    qrLibPromise = new Promise(function(resolve, reject) {
      const s = document.createElement("script");
      s.src = "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";
      s.async = true;
      s.onload = resolve;
      s.onerror = function() { reject(new Error("QR scanner library failed to load.")); };
      document.head.appendChild(s);
    });
    return qrLibPromise;
  }

  async function startScan() {
    show("reader",true); show("closeBtn",true); show("scanBtn",false);
    try {
      await ensureQrLibrary();
    } catch(e) {
      toast(e.message, "err");
      stopScan();
      return;
    }

    scanner = new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:220,height:220}},
      function(txt) {
        let code = txt.trim().toUpperCase();
        try { const u=new URL(txt); const p=u.searchParams.get("employee"); if(p) code=p.toUpperCase(); } catch(_){}
        document.getElementById("empIn").value = code;
        document.getElementById("empIn").dispatchEvent(new Event("input"));
        stopScan();
      }, function(){}
    ).catch(function(e){ toast("Camera error: "+e,"err"); stopScan(); });
  }

  function stopScan() {
    if (scanner) scanner.stop().catch(function(){}).finally(function(){
      scanner=null;
      show("reader",false); show("closeBtn",false); show("scanBtn",true);
      document.getElementById("reader").innerHTML="";
    });
  }

  function show(id,v){ document.getElementById(id).classList.toggle("hidden",!v); }
  function toast(msg,type){ const e=document.getElementById("toast"); e.textContent=msg; e.className="toast show "+(type||""); }
  function hideToast(){ document.getElementById("toast").classList.remove("show"); }

  // ══════════════════════════════════════════════════════════════════════
  // Logs History + On Break side panels.
  // Purely additive: nothing above this line is modified. This block only
  // wraps toast() and updateReminderStack() from the outside so it can
  // observe the same successful taps / state recalculations the kiosk
  // already produces, without changing any existing logic or function body.
  // ══════════════════════════════════════════════════════════════════════
  (function() {
    const MAX_LOG_ENTRIES = 60;
    const AVATAR_COLOR_PAIRS = [
      ["#FF00FF","#00FFFF"],
      ["#FF9900","#FF00FF"],
      ["#00FFFF","#7A5CFF"],
      ["#FF3B6B","#FF9900"],
      ["#7A5CFF","#00FFFF"],
      ["#00FFB3","#00FFFF"]
    ];

    // Logs History is derived straight from the same todayRecords /
    // previousRecords data the On Break panel already reads — this is the
    // data the kiosk already has as soon as it syncs, and it is kept current
    // by the same optimistic local update doAction() already performs before
    // it calls updateReminderStack(). No new fetch, no new state is added.
    const LOG_FIELDS = ["departure","shortBreakEnd","breakEnd","shortBreakStart","breakStart","arrival"];

    function buildDerivedLogs() {
      const entries = [];

      employees.forEach(function(emp) {
        const codeKey = String(emp.code || "").toUpperCase();
        [
          { rec: todayRecords[codeKey], fallbackDate: todayDateStr || fmt() },
          { rec: previousRecords[codeKey], fallbackDate: previousDateStr || dateOffsetStr(new Date(), -1) }
        ].forEach(function(entry) {
          const rec = entry.rec;
          if (!rec) return;
          const baseDate = rec.workDate || rec.date || entry.fallbackDate;

          LOG_FIELDS.forEach(function(field) {
            const value = rec[field];
            if (!hasValue(value)) return;
            const mins = timeTextToMinutes(value);
            const sortTime = mins !== null
              ? String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0")
              : "00:00";
            entries.push({
              name: emp.name,
              action: labels[field] || field,
              time: value,
              sortKey: baseDate + "T" + sortTime
            });
          });
        });
      });

      entries.sort(function(a, b) { return b.sortKey.localeCompare(a.sortKey); });
      return entries.slice(0, MAX_LOG_ENTRIES);
    }

    function initials(name) {
      const t = String(name || "").trim();
      if (!t) return "?";
      const parts = t.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function avatarGradient(name) {
      const text = String(name || "");
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
      const pair = AVATAR_COLOR_PAIRS[hash % AVATAR_COLOR_PAIRS.length];
      return "linear-gradient(135deg," + pair[0] + "," + pair[1] + ")";
    }

    function renderLogs() {
      const el = document.getElementById("logsList");
      if (!el) return;
      const logEntries = buildDerivedLogs();
      if (!logEntries.length) {
        el.innerHTML = '<div class="side-empty">No activity yet.</div>';
        return;
      }
      el.innerHTML = logEntries.map(function(item) {
        return '<div class="log-item">' +
          '<div class="log-avatar" style="background:' + avatarGradient(item.name) + '">' + escapeHtml(initials(item.name)) + '</div>' +
          '<div class="log-info">' +
            '<div class="log-name">' + escapeHtml(item.name) + '</div>' +
            '<div class="log-action">' + escapeHtml(item.action) + '</div>' +
          '</div>' +
          '<div class="log-time">' + escapeHtml(item.time) + '</div>' +
        '</div>';
      }).join("");
    }

    function renderOnBreak() {
      const el = document.getElementById("breakList");
      if (!el) return;

      const onBreak = [];
      employees.forEach(function(emp) {
        const state = getActiveRecordState(emp);
        const rec = cleanStaleNightShiftEnds(state.record || {}, emp);
        if (hasOpenMainBreak(rec)) {
          onBreak.push({ emp: emp, label: "On Break", time: rec.breakStart });
        } else if (hasOpenShortBreak(rec)) {
          onBreak.push({ emp: emp, label: "On Short Break", time: rec.shortBreakStart });
        }
      });

      if (!onBreak.length) {
        el.innerHTML = '<div class="side-empty">No one is on break.</div>';
        return;
      }

      el.innerHTML = onBreak.map(function(item) {
        return '<div class="log-item">' +
          '<div class="log-avatar break" style="background:' + avatarGradient(item.emp.name) + '">' + escapeHtml(initials(item.emp.name)) + '</div>' +
          '<div class="log-info">' +
            '<div class="log-name">' + escapeHtml(item.emp.name) + '</div>' +
            '<div class="log-action">' + escapeHtml(item.label) + '</div>' +
          '</div>' +
          '<div class="log-time">' + escapeHtml(item.time || "") + '</div>' +
        '</div>';
      }).join("");
    }

    // Wrap updateReminderStack() so the On Break panel refreshes at every
    // point the kiosk already recalculates state (initial load, employee
    // lookup, tapped actions, the 1-minute Google Sheet sync), without
    // touching that function's own logic.
    const _originalUpdateReminderStack = updateReminderStack;
    updateReminderStack = function() {
      _originalUpdateReminderStack();
      renderOnBreak();
      renderLogs();
    };

    renderLogs();
    renderOnBreak();
  })();
</script>
